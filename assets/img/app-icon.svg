<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icono de la aplicación LogiFlow Edu (decisión del 21/11/2026).

  Adopta la marca del diálogo «Acerca de» (`src/brand/AppMark.tsx`) en lugar de
  la figura original del ejecutable. Las figuras son las mismas del componente,
  dibujadas en un lienzo de 1024 px con fondo azul de marca y trazo blanco, para
  que el icono sea autocontenido (sin `currentColor` ni recursos externos) y se
  lea en la barra de tareas y en los instaladores.

  Es la fuente del icono: los PNG, .ico y .icns se generan con
  `pnpm tauri icon src-tauri/icons/app-icon.svg` y no se editan a mano.
  `src/brand/appMark.test.ts` comprueba la paridad de la geometría.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#1E4078" />
  <g
    transform="translate(96 141.5) scale(13)"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="6" y="6" width="52" height="14" rx="7" />
    <path d="M32 20v9" />
    <path d="M32 29l16 11-16 11-16-11z" />
    <path d="M16 40H6" />
    <path d="M48 40h10" />
  </g>
</svg>
