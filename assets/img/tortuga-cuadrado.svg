<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="Panel de la tortuga con el trazado de un cuadrado">
  <title>Panel de la tortuga</title>

  <!-- Ventana flotante interna con el tamaño inicial de la aplicación (560 × 440). -->
  <rect x="0.5" y="0.5" width="559" height="439" rx="10" fill="#ffffff" stroke="#c9d2de"/>
  <path d="M1 11Q1 1 11 1H549Q559 1 559 11V36H1Z" fill="#fbfcfe"/>
  <line x1="1" y1="36" x2="559" y2="36" stroke="#c9d2de"/>

  <text x="12" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" fill="#1c2430">TORTUGA</text>
  <rect x="493" y="5" width="58" height="26" rx="6" fill="#f8fafc" stroke="#c9d2de"/>
  <text x="522" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1c2430" text-anchor="middle">Cerrar</text>

  <!-- Controles reales: cuadrícula, zoom, ajustar al dibujo y exportar dibujo. -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1c2430">
    <rect x="12" y="59" width="14" height="14" rx="3" fill="#ffffff" stroke="#aeb8c4"/>
    <path d="M15 66L18 69L23 62" fill="none" stroke="#1e4080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="70" font-size="13">Cuadrícula</text>

    <rect x="99" y="53" width="28" height="26" rx="6" fill="#f8fafc" stroke="#c9d2de"/>
    <text x="113" y="70" text-anchor="middle">+</text>
    <rect x="135" y="53" width="28" height="26" rx="6" fill="#f8fafc" stroke="#c9d2de"/>
    <text x="149" y="70" text-anchor="middle">−</text>
    <text x="215" y="70" text-anchor="end" fill-opacity="0.75">100 %</text>
    <rect x="223" y="53" width="102" height="26" rx="6" fill="#f8fafc" stroke="#c9d2de"/>
    <text x="274" y="70" text-anchor="middle">Ajustar al dibujo</text>
    <rect x="333" y="53" width="98" height="26" rx="6" fill="#f8fafc" stroke="#c9d2de"/>
    <text x="382" y="70" text-anchor="middle">Exportar dibujo</text>
  </g>

  <!-- Lienzo del dibujo: fondo blanco, borde y esquinas redondeadas. -->
  <rect x="12" y="85" width="536" height="341" rx="6" fill="#ffffff" stroke="#c9d2de"/>

  <!-- Asa de redimensión de la ventana flotante. -->
  <g stroke="#9aa6b5" stroke-width="1.2" stroke-linecap="round">
    <path d="M546 428L553 435"/>
    <path d="M541 430L549 438"/>
    <path d="M536 432L544 440"/>
  </g>

  <!-- Dibujo real: tres lados del cuadrado y marcador de rumbo al oeste. -->
  <g transform="translate(109.5 85)">
    <svg width="341" height="341" viewBox="-16 -156 172 172" preserveAspectRatio="xMidYMid meet">
      <rect x="-16" y="-156" width="172" height="172" fill="#ffffff"/>

      <!-- Ejes del panel. -->
      <line x1="-16" y1="0" x2="156" y2="0" stroke="#8a8a8a" stroke-width="1"/>
      <line x1="0" y1="-156" x2="0" y2="16" stroke="#8a8a8a" stroke-width="1"/>

      <!-- Cuadrícula opcional: paso de 25 unidades. -->
      <g stroke="#d8d8d8" stroke-width="0.5">
        <line x1="0" y1="-156" x2="0" y2="16"/>
        <line x1="25" y1="-156" x2="25" y2="16"/>
        <line x1="50" y1="-156" x2="50" y2="16"/>
        <line x1="75" y1="-156" x2="75" y2="16"/>
        <line x1="100" y1="-156" x2="100" y2="16"/>
        <line x1="125" y1="-156" x2="125" y2="16"/>
        <line x1="150" y1="-156" x2="150" y2="16"/>
        <line x1="-16" y1="-150" x2="156" y2="-150"/>
        <line x1="-16" y1="-125" x2="156" y2="-125"/>
        <line x1="-16" y1="-100" x2="156" y2="-100"/>
        <line x1="-16" y1="-75" x2="156" y2="-75"/>
        <line x1="-16" y1="-50" x2="156" y2="-50"/>
        <line x1="-16" y1="-25" x2="156" y2="-25"/>
        <line x1="-16" y1="0" x2="156" y2="0"/>
      </g>

      <!-- Trazo verde de la tortuga: izquierda, arriba y derecha. -->
      <g stroke="#2f7d32" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-140"/>
        <line x1="0" y1="-140" x2="140" y2="-140"/>
        <line x1="140" y1="-140" x2="140" y2="0"/>
      </g>

      <!-- Marcador de rumbo: la tortuga está en (140, 0) mirando al oeste. -->
      <line x1="132" y1="0" x2="140" y2="0" stroke="#2f7d32" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </g>

  <!-- Borde del lienzo por encima del dibujo para conservar las esquinas. -->
  <rect x="12" y="85" width="536" height="341" rx="6" fill="none" stroke="#c9d2de"/>
</svg>
