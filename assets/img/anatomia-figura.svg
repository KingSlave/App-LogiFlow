<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Anatomía de una figura del diagrama">
  <title>Partes de una figura y sus enlaces</title>
  <rect width="760" height="440" fill="#f4f6fa"/>
  <g stroke="#dbe2ec" stroke-width="1">
    <path d="M60 80H700M60 160H700M60 240H700M60 320H700M60 400H700"/>
    <path d="M60 80V400M140 80V400M220 80V400M300 80V400M380 80V400M460 80V400M540 80V400M620 80V400"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Terminals and connector -->
    <rect x="280" y="36" width="160" height="34" rx="17" fill="#e7eaf0" stroke="#3b4453" stroke-width="2"/>
    <text x="360" y="58" font-size="12" text-anchor="middle" fill="#1c2430">Inicio</text>
    <path d="M360 70v42" stroke="#3b4453" stroke-width="2" marker-end="url(#a)"/>
    <text x="372" y="94" font-size="10" fill="#5b6573">conector</text>

    <!-- Figure -->
    <rect x="200" y="112" width="320" height="78" rx="3" fill="#e8f1fb" stroke="#245c9c" stroke-width="2.5"/>
    <path d="M210 120V182" stroke="#245c9c" stroke-width="2"/>
    <text x="372" y="157" font-size="15" text-anchor="middle" fill="#1c2430">Declarar edad, promedio</text>

    <!-- Selection halo -->
    <rect x="194" y="106" width="332" height="90" rx="5" fill="none" stroke="#1e4080" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="372" y="98" font-size="10" text-anchor="middle" fill="#1e4080">selección</text>

    <!-- Delete cross -->
    <circle cx="526" cy="106" r="11" fill="#ffffff" stroke="#a4262c" stroke-width="1.6"/>
    <path d="M522 102l8 8M530 102l-8 8" stroke="#a4262c" stroke-width="1.8"/>

    <!-- Insertion link -->
    <path d="M360 190v54" stroke="#3b4453" stroke-width="2"/>
    <circle cx="360" cy="256" r="13" fill="#ffffff" stroke="#1e4080" stroke-width="2"/>
    <path d="M360 249v14M353 256h14" stroke="#1e4080" stroke-width="2"/>
    <path d="M360 269v34" stroke="#3b4453" stroke-width="2" marker-end="url(#a)"/>

    <rect x="280" y="303" width="160" height="34" rx="17" fill="#e7eaf0" stroke="#3b4453" stroke-width="2"/>
    <text x="360" y="325" font-size="12" text-anchor="middle" fill="#1c2430">Fin</text>

    <!-- Callouts -->
    <g stroke="#1e4080" stroke-width="1.3" fill="none">
      <path d="M420 145h70"/>
      <path d="M300 145H150"/>
      <path d="M360 256h100"/>
      <path d="M360 30v-18"/>
      <path d="M526 106l50-34"/>
    </g>
    <g fill="#1e4080" font-size="12" font-weight="700" text-anchor="middle">
      <circle cx="500" cy="145" r="12"/>
      <text x="500" y="149" fill="#fff">1</text>
      <circle cx="130" cy="145" r="12"/>
      <text x="130" y="149" fill="#fff">2</text>
      <circle cx="480" cy="256" r="12"/>
      <text x="480" y="260" fill="#fff">3</text>
      <circle cx="360" cy="2" r="12"/>
      <text x="360" y="6" fill="#fff">4</text>
      <circle cx="594" cy="58" r="12"/>
      <text x="594" y="62" fill="#fff">5</text>
    </g>
    <g font-size="11" fill="#1c2430">
      <text x="520" y="136">Forma y color de la familia</text>
      <text x="20" y="136">Etiqueta de la instrucción</text>
      <text x="500" y="250">Enlace «+» para insertar</text>
      <text x="376" y="22" font-size="10">Entrada</text>
      <text x="610" y="52">Quitar («×»)</text>
    </g>
    <g font-size="10" fill="#5b6573">
      <text x="496" y="278">Doble clic sobre la figura para editar sus propiedades.</text>
      <text x="210" y="392">El «+» aparece entre figuras y dentro de ramas y cuerpos.</text>
      <text x="210" y="410">Cada figura conserva su forma, su etiqueta y sus dos puertos de conexión.</text>
    </g>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b4453"/>
    </marker>
  </defs>
</svg>
